<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6569">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trotta Admin">
<link rel="manifest" href="manifest-admin.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Studio Trotta · Admin</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root { --brand:#0e6569; --soft:#e6eeef; --text:#12393b; --muted:#557274; --line:#cfdcdd; --ok:#2f8f5b; --warn:#c0702a; --bad:#b3261e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--soft); color: var(--text); font-family: "Satoshi", system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.45; min-height: 100vh; }
  header { background: linear-gradient(160deg, #0e6569, #0a4d50); color: #fff; padding: calc(env(safe-area-inset-top) + 18px) 18px 70px; display: flex; align-items: center; justify-content: space-between; border-radius: 0 0 28px 28px; }
  header img { height: 46px; display: block; }
  header small { display: block; opacity: .8; font-size: 12.5px; margin-top: 6px; }
  #refresh { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 50%; width: 42px; height: 42px; font-size: 20px; line-height: 1; }
  #refresh.spin { animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card { animation: up .45s ease both; }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; }
  .hero { display: flex; align-items: center; gap: 16px; }
  .hero .big { font-size: 56px; font-weight: 900; line-height: 1; color: var(--brand); }
  .hero .stars { color: #f2b01e; font-size: 20px; letter-spacing: 2px; margin-top: 4px; }
  .hero small { color: var(--muted); font-size: 13px; }
  .ring { margin-left: auto; position: relative; width: 84px; height: 84px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; color: var(--brand); line-height: 1; }
  .ring b small { font-size: 10.5px; font-weight: 500; margin-top: 3px; }
  .av { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--soft); color: var(--brand); font-weight: 900; display: flex; align-items: center; justify-content: center; margin-right: 10px; }
  .row { display: flex; align-items: flex-start; }
  .row .body { flex: 1; min-width: 0; }
  main { max-width: 520px; margin: -44px auto 0; padding: 0 14px calc(env(safe-area-inset-bottom) + 30px); }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(31,95,91,.08); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { background: var(--soft); border-radius: 12px; padding: 12px; }
  .kpi b { display: block; font-size: 28px; line-height: 1.1; color: var(--brand); }
  .kpi span { font-size: 12.5px; color: var(--muted); }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
  .bar i { flex: 1; height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
  .bar u { display: block; height: 100%; border-radius: 6px; text-decoration: none; transition: width .8s ease; }
  .bar em { width: 22px; text-align: right; font-style: normal; color: var(--muted); }
  .item { padding: 12px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .item .nome { font-weight: 700; }
  .badge { font-weight: 700; border-radius: 8px; padding: 2px 9px; font-size: 14px; color: #fff; }
  .v5, .v4 { background: var(--ok); } .v3 { background: var(--warn); } .v2, .v1 { background: var(--bad); }
  .item .sub { color: var(--muted); font-size: 13px; }
  .item .txt { margin-top: 6px; font-size: 15px; }
  .g { font-size: 12px; color: var(--brand); font-weight: 700; margin-top: 6px; }
  .msg { text-align: center; color: var(--muted); padding: 24px 10px; }
  .msg button { margin-top: 12px; background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 700; }
  .note { font-size: 12.5px; color: var(--muted); text-align: center; margin: 4px 8px 0; }
  main { padding-bottom: calc(env(safe-area-inset-bottom) + 96px); }
  nav { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 10px); max-width: 496px; margin: 0 auto; display: flex; gap: 4px; padding: 6px; border-radius: 24px; background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 10px 30px rgba(14,101,105,.25); z-index: 5; }
  nav button { flex: 1; border: 0; background: transparent; border-radius: 18px; padding: 9px 4px 7px; font: inherit; font-size: 12px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button span { font-size: 20px; line-height: 1.1; }
  nav button.on { background: var(--brand); color: #fff; box-shadow: 0 6px 16px rgba(14,101,105,.35); }
  label.l { display: block; font-size: 13px; font-weight: 700; margin: 14px 2px 6px; }
  input.f { width: 100%; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; font: inherit; font-size: 16px; background: #fff; color: var(--text); outline: none; -webkit-appearance: none; appearance: none; }
  input.f:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(14,101,105,.15); }
  .go { width: 100%; margin-top: 20px; padding: 16px; border: 0; border-radius: 16px; background: var(--brand); color: #fff; font: inherit; font-size: 16px; font-weight: 700; box-shadow: 0 10px 24px rgba(14,101,105,.35); }
  .go:disabled { opacity: .6; }
  .go.ghost { background: var(--soft); color: var(--brand); box-shadow: none; }
  .err { color: var(--bad); font-size: 14px; text-align: center; margin-top: 10px; min-height: 18px; }
  .done { text-align: center; padding: 14px 0 4px; }
  .done .ck { width: 76px; height: 76px; border-radius: 50%; background: var(--brand); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px rgba(14,101,105,.35); }
  .done .ck svg { width: 38px; height: 38px; stroke: #fff; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .done h2 { font-size: 22px; margin: 0 0 6px; } .done p { color: var(--muted); margin: 0 0 8px; }
  .delta { font-size: 12px; font-weight: 700; margin-left: 4px; } .delta.up { color: var(--ok); } .delta.dn { color: var(--bad); }
  details summary { cursor: pointer; font-weight: 700; color: var(--brand); list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>
<header>
  <div><img src="logo.png" alt="Studio Trotta"><small id="agg">Versione completa</small></div>
  <button id="refresh" aria-label="Aggiorna">↻</button>
</header>
<main id="app"><div class="card msg">Carico i dati…</div></main>
<nav id="nav">
  <button data-t="req"><span>📥</span>Richieste</button>
  <button data-t="res" class="on"><span>📊</span>Resoconto</button>
  <button data-t="new"><span>⭐</span>Recensioni</button>
  <button data-t="goo"><span>📍</span>Google</button>
</nav>
<script>
(function () {
  var API = "https://giuliog.app.n8n.cloud/webhook/trotta-stats";
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app");
  var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  // la chiave arriva dal link (#k=...) la prima volta e resta salvata sul telefono
  var m = location.hash.match(/(?:^#|&)k=([^&]+)/);
  if (m) { LS.set("adm_k", decodeURIComponent(m[1])); }
  var ma = location.hash.match(/(?:^#|&)a=([^&]+)/);
  if (ma) { LS.set("adm_a", decodeURIComponent(ma[1])); }
  var AKEY = LS.get("adm_a");
  var r2 = location.hash.match(/(?:^#|&)r=([^&]+)/);
  if (r2) { try { localStorage.setItem("tk", decodeURIComponent(r2[1])); } catch (e) {} }
  if (m || r2 || ma) history.replaceState(null, "", location.pathname);
  var KEY = LS.get("adm_k");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function askKey() {
    app.innerHTML = '<div class="card msg">Per vedere i dati apri il link privato che ti ha dato Giulio, oppure incolla qui la chiave.<br><input id="k" style="margin-top:12px;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit"><br><button id="ks">Entra</button></div>';
    $("ks").onclick = function () { var v = $("k").value.trim(); if (v) { LS.set("adm_k", v); KEY = v; go(TAB); } };
  }

  function render(d) {
    var pct = d.inviate ? Math.round(d.risposte / d.inviate * 100) : 0;
    var maxD = Math.max.apply(null, d.distribuzione.concat([1]));
    var R = 36, C = 2 * Math.PI * R;
    var full = d.media == null ? 0 : Math.round(d.media);
    var stars = ""; for (var i = 1; i <= 5; i++) stars += i <= full ? "★" : "☆";
    var h = '<div class="card"><div class="hero"><div><div class="big">' + (d.media == null ? "–" : String(d.media).replace(".", ",")) + '</div><div class="stars">' + stars + '</div><small>voto medio su 5</small></div>' +
      '<div class="ring"><svg width="84" height="84"><circle cx="42" cy="42" r="' + R + '" fill="none" stroke="#e6eeef" stroke-width="9"/><circle cx="42" cy="42" r="' + R + '" fill="none" stroke="#0e6569" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (C * pct / 100) + ' ' + C + '"/></svg><b>' + pct + '%<small>risposte</small></b></div></div>' +
      '<div class="grid" style="margin-top:16px">' +
      '<div class="kpi"><b>' + d.inviate + '</b><span>Richieste inviate</span></div>' +
      '<div class="kpi"><b>' + d.click + '</b><span>Hanno aperto Google per recensire</span></div></div></div>';
    h += '<div class="card"><h2>Come hanno votato</h2>';
    for (var n = 5; n >= 1; n--) {
      var c = d.distribuzione[n - 1];
      h += '<div class="bar"><span style="width:14px">' + n + '</span><i><u style="background:' + (n >= 4 ? "var(--ok)" : n === 3 ? "var(--warn)" : "var(--bad)") + ';width:' + Math.round(c / maxD * 100) + '%"></u></i><em>' + c + '</em></div>';
    }
    h += '</div><div class="card"><h2>Ultimi feedback</h2>';
    if (!d.voti.length) h += '<div class="msg">Ancora nessun feedback.</div>';
    d.voti.forEach(function (v) {
      h += '<div class="item row"><div class="av">' + esc((v.nome || "?").charAt(0).toUpperCase()) + '</div><div class="body"><div class="top"><span class="nome">' + esc(v.nome) + '</span><span class="badge v' + v.voto + '">' + v.voto + '/5</span></div>' +
        '<div class="sub">' + esc(v.trattamento) + '</div>' +
        (v.commento ? '<div class="txt">' + esc(v.commento) + '</div>' : '') +
        (v.google ? '<div class="g">✓ Ha aperto Google per recensire</div>' : '') + '</div></div>';
    });
    h += '</div><div class="note">Nota: Google non dice se la recensione è stata pubblicata davvero. Qui vedi chi ha aperto la pagina per scriverla.</div>';
    app.innerHTML = h;
    $("agg").textContent = "Aggiornato alle " + new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  }

  function loadRes() {
    if (!KEY) return askKey();
    app.innerHTML = '<div class="card msg">Carico i dati…</div>';
    fetch(API + "?k=" + encodeURIComponent(KEY), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) { LS.set("adm_k", ""); KEY = ""; return askKey(); }
        LS.set("adm_cache", JSON.stringify(d)); if (TAB === "res") render(d);
      })
      .catch(function () {
        if (TAB !== "res") return;
        var c = LS.get("adm_cache");
        if (c) { try { render(JSON.parse(c)); $("agg").textContent = "Offline: ultimi dati salvati"; return; } catch (e) {} }
        app.innerHTML = '<div class="card msg">Non riesco a caricare i dati. Controlla la connessione e riprova.<br><button onclick="location.reload()">Riprova</button></div>';
      });
  }

  var TAB = "res";
  var API_NEW = "https://giuliog.app.n8n.cloud/webhook/trotta-nuovo-invio";
  var API_G = "https://giuliog.app.n8n.cloud/webhook/trotta-google";
  var API_R = "https://giuliog.app.n8n.cloud/webhook/trotta-google-recensioni";
  var API_GS = "https://giuliog.app.n8n.cloud/webhook/trotta-google-salva";
  var CHECK = '<div class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>';

  function go(t) {
    TAB = t;
    [].forEach.call(document.querySelectorAll("#nav button"), function (b) { b.classList.toggle("on", b.dataset.t === t); });
    window.scrollTo(0, 0);
    if (!KEY) return askKey();
    if (t === "req") return viewReq();
    if (t === "new") return viewNew();
    if (t === "goo") return viewGoogle();
    loadRes();
  }
  [].forEach.call(document.querySelectorAll("#nav button"), function (b) { b.onclick = function () { go(b.dataset.t); }; });

  function post(url, body) {
    body.k = KEY;
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }

  function viewReq() {
    $("agg").textContent = "Richieste di valutazione";
    app.innerHTML = '<iframe src="richieste.html" title="Richieste" style="width:100%;height:calc(100vh - 210px);min-height:420px;border:0;border-radius:18px;background:#fff;box-shadow:0 6px 18px rgba(31,95,91,.12)"></iframe>';
  }

  function viewNew() {
    $("agg").textContent = "Richiedi recensioni";
    app.innerHTML = '<div class="card" id="fx"><h2 style="font-size:20px;margin-bottom:2px">Richiedi recensioni ⭐</h2><div class="sub" style="color:var(--muted);font-size:14px">Inserisci il paziente: la richiesta parte in automatico il giorno dopo.</div>' +
      '<label class="l" for="n">Nome e cognome</label><input class="f" id="n" placeholder="Mario Rossi" autocomplete="off">' +
      '<label class="l" for="t">Telefono</label><input class="f" id="t" type="tel" inputmode="tel" placeholder="333 1234567" autocomplete="off">' +
      '<label class="l" for="p">Problematica</label><input class="f" id="p" placeholder="Es. lombalgia, cervicale, ginocchio" autocomplete="off">' +
      '<button class="go" id="s">Richiedi recensione</button><div class="err" id="e"></div></div>';
    $("s").onclick = function () {
      var n = $("n").value.trim(), t = $("t").value.trim(), p = $("p").value.trim();
      if (n.length < 2 || t.replace(/\D/g, "").length < 6 || p.length < 2) { $("e").textContent = "Compila tutti i campi."; return; }
      $("e").textContent = ""; var b = $("s"); b.disabled = true; b.textContent = "Salvo…";
      post(API_NEW, { nome: n, telefono: t, problematica: p }).then(function (j) {
        if (!j || !j.ok) throw 0;
        $("fx").innerHTML = '<div class="done">' + CHECK + '<h2>Fatto</h2><p>La richiesta per <b>' + esc(n) + '</b> partirà ' + esc(j.quando) + '.</p><button class="go ghost" id="a">Aggiungi un altro paziente</button></div>';
        $("a").onclick = viewNew;
      }).catch(function () { b.disabled = false; b.textContent = "Richiedi recensione"; $("e").textContent = "Qualcosa non ha funzionato, riprova."; });
    };
  }

  function dlt(a, b) {
    if (b == null || a == null) return "";
    var d = Math.round((a - b) * 10) / 10; if (!d) return "";
    return '<span class="delta ' + (d > 0 ? "up" : "dn") + '">' + (d > 0 ? "▲ +" : "▼ ") + String(d).replace(".", ",") + '</span>';
  }


  function loadAuto() {
    if (!AKEY) { app.insertAdjacentHTML("afterbegin", '<div class="card msg">Manca la chiave admin (parametro a= nel link): senza non vedo le recensioni lette da Google.</div>'); return; }
    fetch(API_R + "?a=" + encodeURIComponent(AKEY), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      if (TAB !== "goo") return;
      if (!d || !d.ok) { app.insertAdjacentHTML("afterbegin", '<div class="card msg">Chiave admin non valida.</div>'); return; }
      var h = '<div class="card"><h2>Recensioni su Google (lette ogni giorno alle 08:00)</h2>';
      if (d.totale == null) h += '<div class="msg" style="padding:10px">Ancora nessuna lettura: la chiave Google non è stata inserita o la prima lettura delle 08:00 non è ancora partita.</div>';
      else {
        h += '<div class="grid"><div class="kpi"><b>' + d.totale + dlt(d.totale, d.storico.length > 1 ? d.storico[d.storico.length - 2].totale : null) + '</b><span>Recensioni totali · media ' + String(d.media).replace(".", ",") + '</span></div>' +
          '<div class="kpi"><b>' + d.portate + '</b><span>Possibilmente portate dal servizio</span></div></div>' +
          '<div class="note" style="text-align:left;margin:10px 2px 0">Sono abbinamenti per nome, quindi solo “possibili”' + (d.solo_nome ? ' (' + d.solo_nome + ' con il solo nome, i meno affidabili)' : '') + '. Aggiornato il ' + esc(String(d.aggiornato).split("-").reverse().join("/")) + '.</div>';
      }
      h += '</div>';
      if (d.recensioni && d.recensioni.length) {
        h += '<div class="card"><h2>Recensioni lette</h2>';
        d.recensioni.slice(0, 40).forEach(function (x) {
          var st = ""; for (var i = 1; i <= 5; i++) st += i <= x.stelle ? "★" : "☆";
          h += '<div class="item"><div class="top"><span class="nome">' + esc(x.autore) + '</span><span style="color:#f2b01e;letter-spacing:1px">' + st + '</span></div>' +
            '<div class="sub">' + esc(String(x.pubblicata).slice(0, 10).split("-").reverse().join("/")) + '</div>' +
            (x.testo ? '<div class="txt">' + esc(x.testo) + '</div>' : '') +
            (x.match ? '<div class="g">Possibile paziente: ' + esc(x.paziente) + (x.match === "bassa" ? " (solo nome)" : " (nome e cognome/iniziale)") + '</div>' : '') + '</div>';
        });
        h += '</div><div class="note">Google rende disponibili solo poche recensioni alla volta: se in un giorno ne arrivano molte, qualcuna può sfuggire.</div>';
      }
      app.insertAdjacentHTML("afterbegin", h);
    }).catch(function () {});
  }

  function viewGoogle() {
    $("agg").textContent = "Scheda Google";
    app.innerHTML = '<div class="card msg">Carico i dati…</div>';
    fetch(API_G + "?k=" + encodeURIComponent(KEY), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      if (TAB !== "goo") return;
      if (!d || !d.ok) { LS.set("adm_k", ""); KEY = ""; return askKey(); }
      var r = d.righe || [], L = r[r.length - 1], P = r[r.length - 2], h = "";
      if (!L) h += '<div class="card msg">Ancora nessun dato. Aggiungi i primi numeri qui sotto.</div>';
      else {
        var K = [["chiamate", "Chiamate dalla scheda"], ["indicazioni", "Richieste di indicazioni"], ["sito", "Visite al sito"], ["recensioni", "Recensioni su Google"]];
        h += '<div class="card"><h2>Scheda Google · ' + esc(L.data.split("-").reverse().join("/")) + '</h2><div class="grid">';
        K.forEach(function (x) { h += '<div class="kpi"><b>' + L[x[0]] + dlt(L[x[0]], P && P[x[0]]) + '</b><span>' + x[1] + '</span></div>'; });
        h += '</div><div class="hero" style="margin-top:14px"><div><div class="big" style="font-size:40px">' + String(L.media).replace(".", ",") + '</div><div class="stars">★★★★★</div><small>media su Google</small></div></div></div>';
        if (r.length > 1) {
          var mx = Math.max.apply(null, r.map(function (x) { return x.chiamate; }).concat([1]));
          h += '<div class="card"><h2>Chiamate nel tempo</h2><div style="display:flex;align-items:flex-end;gap:6px;height:90px">';
          r.slice(-12).forEach(function (x) { h += '<div style="flex:1;text-align:center;font-size:10px;color:var(--muted)"><div style="background:var(--brand);border-radius:6px 6px 2px 2px;height:' + Math.max(4, Math.round(x.chiamate / mx * 70)) + 'px"></div>' + x.chiamate + '</div>'; });
          h += '</div></div>';
        }
      }
      h += '<div class="card"><details><summary>＋ Aggiorna i numeri</summary><div class="two">' +
        '<div><label class="l">Chiamate</label><input class="f" id="g1" type="number" inputmode="numeric"></div><div><label class="l">Indicazioni</label><input class="f" id="g2" type="number" inputmode="numeric"></div>' +
        '<div><label class="l">Visite sito</label><input class="f" id="g3" type="number" inputmode="numeric"></div><div><label class="l">N° recensioni</label><input class="f" id="g4" type="number" inputmode="numeric"></div></div>' +
        '<label class="l">Media stelle</label><input class="f" id="g5" inputmode="decimal" placeholder="4,8">' +
        '<button class="go" id="gs">Salva</button><div class="err" id="ge"></div></details></div>';
      app.innerHTML = h;
      loadAuto();
      $("gs").onclick = function () {
        var v = [1, 2, 3, 4, 5].map(function (i) { return $("g" + i).value; });
        if (v.some(function (x) { return x === ""; })) { $("ge").textContent = "Compila tutti i campi."; return; }
        var b = $("gs"); b.disabled = true; b.textContent = "Salvo…";
        post(API_GS, { chiamate: v[0], indicazioni: v[1], sito: v[2], recensioni: v[3], media: v[4] }).then(function (j) { if (!j || !j.ok) throw 0; viewGoogle(); })
          .catch(function () { b.disabled = false; b.textContent = "Salva"; $("ge").textContent = "Non sono riuscito a salvare, riprova."; });
      };
    }).catch(function () { if (TAB !== "goo") return; app.innerHTML = '<div class="card msg">Non riesco a caricare i dati.<br><button onclick="location.reload()">Riprova</button></div>'; });
  }
  $("refresh").onclick = function () { $("refresh").classList.add("spin"); go(TAB); setTimeout(function () { $("refresh").classList.remove("spin"); }, 900); };
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  go('res');
})();
</script>
</body>
</html>
